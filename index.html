<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/wish-secret-2027/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Секрет Желаний: Твоя карта желаний 2027 — уютная игра в жанре Merge & Decorate с ежедневными аффирмациями и гороскопом.">

  <!-- iOS Safari PWA теги -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Секрет Желаний 2027">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Секрет Желаний: Твоя карта желаний 2027</title>
  <link rel="manifest" href="manifest.json">

  <!-- 1. SDK ВКонтакте и Одноклассников (VK Bridge) -->
  <script src="https://unpkg.com"></script>

  <!-- 2. SDK Яндекс Игр (подключается безопасно, если игра открыта в контуре Яндекса) -->
  <script>
    (function () {
      if (window.location.hostname.indexOf('yandex') !== -1 ||
          window.location.search.indexOf('app-id=') !== -1) {
        var s = document.createElement('script');
        s.src = '/sdk.js';
        s.async = true;
        document.head.appendChild(s);
      }
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F7F3EE;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Эстетичный экран загрузки «Тихая роскошь» до старта Flutter Web */
    #luxury-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #FDFBF7 0%, #EFE4D6 100%);
      transition: opacity 0.45s ease-out, visibility 0.45s ease-out;
    }

    #luxury-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gold-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2.5px solid rgba(212, 175, 55, 0.25);
      border-top-color: #D4AF37;
      animation: spin 1.1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.22);
    }

    .loader-title {
      margin-top: 20px;
      font-size: 22px;
      font-weight: 600;
      color: #2D241E;
      letter-spacing: 0.4px;
    }

    .loader-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #7A6D64;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Фирменный прелоадер -->
  <div id="luxury-loader">
    <div class="gold-ring"></div>
    <div class="loader-title">Секрет Желаний</div>
    <div class="loader-subtitle">Готовим твою карту мечты 2027 ✨</div>
  </div>

  <script>
    // Скрываем прелоадер, как только Flutter отрисовал первый кадр приложения
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('luxury-loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function () { loader.remove(); }, 500);
      }
    });

    // Блокируем контекстное меню браузера при долгом нажатии на экран
    window.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });
  </script>

  <!-- Стандартный загрузчик Flutter Web -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
